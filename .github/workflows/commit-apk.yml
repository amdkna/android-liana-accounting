name: Store APK in repository

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Copy APK into repository
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/Liana-Accounting-v0.1.0-debug.apk
          sha256sum releases/Liana-Accounting-v0.1.0-debug.apk > releases/Liana-Accounting-v0.1.0-debug.apk.sha256

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Liana-Accounting-v0.1.0-debug.apk releases/Liana-Accounting-v0.1.0-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "APK is already current"
            exit 0
          fi
          git commit -m "build: add installable Android APK"
          git push
